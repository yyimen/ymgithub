name: Install Node.js 18.18.2 32-bit using NVM on Windows

on:
  push:
    branches:
      - testCI

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Use Node.js
      #   uses: irby/setup-node-nvm@master
      #   with:
      #     node-version: '18.18.2 32'
      
      # 下载并安装 NVM
      - name: Install NVM
        run: |
          Invoke-WebRequest -Uri https://github.com/coreybutler/nvm-windows/releases/download/1.2.2/nvm-setup.zip -OutFile nvm-setup.zip
          Expand-Archive -Path nvm-setup.zip -DestinationPath .
          Get-Location
          .\nvm-setup\nvm-setup.exe /S
          cmd /c dir 
          nvm.exe install 18.18.2 32
          nvm use 18.18.2 32
          node -v
          npm -v
          node -p "process.arch"
        shell: powershell          

