name: Install Node.js 18.18.2 32-bit using NVM on Windows

on:
  push:
    branches:
      - testCI

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 下载 mc
      - name: Download mc
        run: |
          Invoke-WebRequest -Uri https://dl.min.io/client/mc/release/windows-amd64/mc.exe -OutFile mc.exe
        shell: powershell

      # 将 mc 所在目录添加到环境变量
      - name: Add mc to PATH
        run: |
          $env:PATH = "$env:PATH;$PWD"
          [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH, [System.EnvironmentVariableTarget]::Process)
        shell: powershell

      # 验证 mc 安装
      - name: Verify mc installation
        run: |
          Get-Location
          cmd /c dir 
          ./mc.exe alias set ymminio https://minio.hy.yyimen.com:89 '' ''
          ./mc.exe ls ymminio/temp
          ./mc.exe cp ./mc.exe ymminio/temp
        shell: powershell

      - name: Use Node.js
        uses: irby/setup-node-nvm@master
        with:
          node-version: '18.18.2 32'

      - name: Verify Node.js and npm versions
        run: |
          Get-Location
          cmd /c dir 
          dir D:\a\_actions\irby\setup-node-nvm\master\mynvm
          D:\a\_actions\irby\setup-node-nvm\master\mynvm\nodejs\node.exe -v
          D:\a\_actions\irby\setup-node-nvm\master\mynvm\nodejs\node.exe -p "process.arch"
          node -v
          npm -v
          node -p "process.arch"
        shell: powershell
         
