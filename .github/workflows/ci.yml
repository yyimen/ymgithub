    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install nvm-windows
      shell: powershell
      run: |
        # 下载 nvm-windows 安装包
        $nvmUrl = "https://github.com/coreybutler/nvm-windows/releases/download/1.1.11/nvm-setup.exe"
        Invoke-WebRequest -Uri $nvmUrl -OutFile nvm-setup.exe
        
        # 静默安装 nvm-windows
        Start-Process nvm-setup.exe -Wait -ArgumentList '/S'

        # 更新环境变量（确保后续步骤能识别 nvm 命令）
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")

    - name: Install Node.js 18.18.2 (32-bit)
      shell: powershell
      run: |
        # 使用 nvm 安装 32 位 Node.js
        nvm install 18.18.32  # 注意：nvm-windows 的 32 位版本需指定特殊后缀
        nvm use 18.18.32

        # 验证安装
        node -v
        npm -v
        node -p "process.arch"  # 应输出 "ia32"    