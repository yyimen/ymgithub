name: Install Node.js 18.18.2 32-bit on Windows
on:
  push:
    branches:
      - testCI
jobs:
  install-nodejs:
    runs-on: windows-latest
    steps:
      - name: env check
        shell: powershell
        run: |
          cmd /c "dir c:\Program Files"
          cmd /c "dir c:\Program Files(x86)"

      
      - name: check node install
        shell: cmd  
        run: |
          node -p "process.arch"
          node --version  

